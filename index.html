<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="cabecera">
      <h1>Planificador de Tareas</h1>
    </div>

    <form class="form">
      <div class="campo campo-actividad">
        <label for="input">Actividad</label>
        <input type="text" id="input" placeholder="Escribe lo que has hecho hoy" />
      </div>
      <div class="campo campo-duracion">
        <label for="duracion">Duración</label>
        <input type="number" id="duracion" placeholder="Minutos" min="1" />
      </div>
      <button id="añadir">Añadir</button>
    </form>

    
    <ul id="lista"></ul>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
